<!doctype html>
<!-- data-theme="light" : le kiosque impose le thème clair, indépendamment de prefers-color-scheme
     de l'appareil (voir styles.css — :root:not([data-theme='light']) dans le bloc @media dark
     saute justement quand cet attribut est posé, c'est le mécanisme prévu pour ça). Une tablette
     kiosque n'a pas de bascule de thème utilisateur — le design (fond crème/orange) n'a jamais été
     pensé pour un rendu sombre. -->
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Commander — ERP v2</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <!-- Généré au démarrage du conteneur en prod (voir docker/env.template.js) — absent en dev,
       api-config.ts et reverb-config.ts retombent alors sur window.location.hostname. -->
  <script src="env.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
