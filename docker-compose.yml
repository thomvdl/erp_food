services:
  db:
    image: mysql:8.4
    container_name: erp_v2_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-erp_v2}
      MYSQL_USER: ${DB_USERNAME:-erp_v2_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-erp_v2_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_PORT:-19306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: erp_v2_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-19080}:8080"
    depends_on:
      - db

  api:
    build:
      context: ./erp-api
    container_name: erp_v2_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./.env
    environment:
      # Wiring fixed by this compose file — not meant to be edited in .env.
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      FILESYSTEM_DISK: local
    ports:
      - "${API_PORT:-19001}:80"

  app:
    build:
      context: ./erp-app
    container_name: erp_v2_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-19002}:4200"
    volumes:
      - ./erp-app:/app
      - app_node_modules:/app/node_modules
    depends_on:
      - api

  validate_event:
    build:
      context: ./erp_validate_event
    container_name: erp_v2_validate_event
    restart: unless-stopped
    ports:
      - "${VALIDATE_EVENT_PORT:-19003}:4200"
    volumes:
      - ./erp_validate_event:/app
      - validate_event_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  db_data:
  app_node_modules:
  validate_event_node_modules:
