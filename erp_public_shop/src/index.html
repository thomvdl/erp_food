<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Boutique en ligne — ERP v2</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- Chrome met les favicons en cache dans une base séparée du cache HTTP normal, qui survient
       même à une fenêtre privée/incognito — ?v=2 force une nouvelle URL jamais vue, seul moyen
       fiable de forcer le rafraîchissement après un changement d'icône. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico?v=2">
  <!-- Généré au démarrage du conteneur en prod (voir docker/env.template.js) — absent en dev,
       api-config.ts retombe alors sur window.location.hostname. -->
  <script src="env.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
