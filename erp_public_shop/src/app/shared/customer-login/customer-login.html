<div class="customer-login">
  @if (session.customer(); as customer) {
    <button type="button" class="customer-login__toggle is-connected" (click)="toggle()">
      👤 {{ customer.firstname }} · {{ customer.points_balance }} pts
    </button>

    @if (open()) {
      <div class="customer-login__scrim" (click)="close()"></div>
      <div class="customer-login__panel">
        <p class="font-semibold">{{ customer.firstname }} {{ customer.lastname }}</p>
        <p class="text-muted text-sm">{{ customer.email }}</p>
        <p class="text-muted text-sm">{{ customer.points_balance }} points de fidélité</p>
        <a class="btn btn-outline btn-sm" routerLink="/mon-compte" (click)="close()">Mon compte</a>
        <button type="button" class="btn btn-ghost btn-sm" (click)="logout()">Se déconnecter</button>
      </div>
    }
  } @else {
    <a class="customer-login__toggle" routerLink="/connexion">👤 Se connecter</a>
  }
</div>
