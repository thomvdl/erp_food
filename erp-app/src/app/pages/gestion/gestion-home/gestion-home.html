<div class="app-topbar">
  <h1 class="text-2xl">Gestion</h1>
</div>

<div class="hub-grid">
  @for (section of sections(); track section.path) {
    <a class="hub-card" [routerLink]="section.path">
      <span class="hub-card__icon">{{ section.icon }}</span>
      <span class="hub-card__title">{{ section.title }}</span>
      <span class="hub-card__description">{{ section.description }}</span>
    </a>
  }
</div>
