<a routerLink="/produits" class="back-link">← Produits</a>

<h1 class="text-2xl">{{ isEdit() ? 'Modifier le produit' : 'Nouveau produit' }}</h1>

<form class="form" (ngSubmit)="submit()">
  <label class="field">
    Nom
    <input class="input" type="text" name="name" [ngModel]="name()" (ngModelChange)="name.set($event)" required />
  </label>

  <label class="field">
    Description
    <textarea
      class="input"
      name="description"
      rows="3"
      [ngModel]="description()"
      (ngModelChange)="description.set($event)"
    ></textarea>
  </label>

  <label class="field">
    Prix (€)
    <input
      class="input"
      type="number"
      step="0.01"
      min="0"
      name="price"
      [ngModel]="price()"
      (ngModelChange)="price.set($event)"
      required
    />
  </label>

  <label class="field">
    SKU
    <input class="input" type="text" name="sku" [ngModel]="sku()" (ngModelChange)="sku.set($event)" />
  </label>

  <label class="field">
    Catégorie
    <select class="select" name="category" [ngModel]="categoryId()" (ngModelChange)="categoryId.set($event)">
      <option [ngValue]="null">— Aucune —</option>
      @for (category of selectableCategories(); track category.id) {
        <option [ngValue]="category.id">{{ category.name }}</option>
      }
    </select>
  </label>

  <div class="field">
    Catalogues
    <div class="checkbox-group">
      @for (catalog of selectableCatalogs(); track catalog.id) {
        <label class="checkbox-field">
          <input
            type="checkbox"
            [checked]="isCatalogChecked(catalog.id)"
            (change)="toggleCatalog(catalog.id, $any($event.target).checked)"
          />
          {{ catalog.name }}
        </label>
      } @empty {
        <span class="text-muted text-sm">Aucun catalogue pour le moment.</span>
      }
    </div>
  </div>

  <label class="field">
    Station
    <select class="select" name="station" [ngModel]="stationId()" (ngModelChange)="stationId.set($event)">
      <option [ngValue]="null">— Aucune —</option>
      @for (station of selectableStations(); track station.id) {
        <option [ngValue]="station.id">{{ station.name }}</option>
      }
    </select>
  </label>

  <label class="field">
    Taxe
    <select class="select" name="tax" [ngModel]="taxId()" (ngModelChange)="taxId.set($event)">
      <option [ngValue]="null">— Aucune —</option>
      @for (tax of selectableTaxes(); track tax.id) {
        <option [ngValue]="tax.id">{{ tax.slug }} ({{ tax.value }}%)</option>
      }
    </select>
  </label>

  <label class="checkbox-field">
    <input type="checkbox" name="active" [ngModel]="active()" (ngModelChange)="active.set($event)" />
    Actif (visible en caisse)
  </label>

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <div class="form-actions">
    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Enregistrement...' : 'Enregistrer' }}
    </button>
    <a class="btn btn-outline" routerLink="/produits">Annuler</a>
  </div>
</form>
