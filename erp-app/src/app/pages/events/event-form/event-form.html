<a routerLink="/evenements" class="back-link">← Événements</a>

<h1 class="text-2xl">{{ isEdit() ? "Modifier l'événement" : 'Nouvel événement' }}</h1>

<div class="card">
<div class="card-body">
<form class="form" (ngSubmit)="submit()">
  <label class="field">
    Nom
    <input class="input" type="text" name="name" [ngModel]="name()" (ngModelChange)="name.set($event)" required />
  </label>

  @if (!isEdit()) {
    <p class="text-muted text-sm">Tu pourras ajouter une ou plusieurs dates (heure, salle, limite de places) juste après.</p>
  }

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <div class="form-actions">
    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Enregistrement...' : 'Enregistrer' }}
    </button>
    <a class="btn btn-outline" routerLink="/evenements">Annuler</a>
  </div>
</form>
</div>
</div>
