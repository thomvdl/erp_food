<div class="modal-overlay" (click)="close()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="card-header">
      <h2>QR self-order — {{ table().label }}</h2>
      <button type="button" class="btn btn-ghost btn-sm btn-icon" (click)="close()">✕</button>
    </div>
    <div class="card-body qr-preview">
      @if (loading()) {
        <p class="text-muted">Chargement…</p>
      } @else if (error()) {
        <p class="error-text">{{ error() }}</p>
      } @else if (imageUrl(); as url) {
        <img [src]="url" alt="QR self-order" width="240" height="240" />
        <p class="text-muted text-sm">À scanner par le client pour commander depuis sa table.</p>
      }
    </div>
    <div class="card-footer form-actions">
      <button type="button" class="btn btn-primary" [disabled]="!imageUrl()" (click)="print()">🖨️ Imprimer</button>
      <button type="button" class="btn btn-outline" (click)="close()">Fermer</button>
    </div>
  </div>
</div>
