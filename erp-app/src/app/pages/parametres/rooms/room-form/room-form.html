<a routerLink="/parametres/salles" class="back-link">← Salles</a>

<h1 class="text-2xl">{{ isEdit() ? 'Renommer la salle' : 'Nouvelle salle' }}</h1>

<form class="form" (ngSubmit)="submit()">
  <label class="field">
    Nom
    <input class="input" type="text" name="name" [ngModel]="name()" (ngModelChange)="name.set($event)" required />
  </label>

  <label class="field">
    Type
    <select class="select" name="type" [ngModel]="type()" (ngModelChange)="type.set($event)">
      <option value="restaurant">Restaurant</option>
      <option value="event">Événement</option>
    </select>
  </label>

  <div style="display: flex; gap: var(--space-3)">
    <label class="field" style="flex: 1">
      Largeur du plan (px)
      <input class="input" type="number" name="width" min="100" [ngModel]="width()" (ngModelChange)="width.set($event)" />
    </label>

    <label class="field" style="flex: 1">
      Hauteur du plan (px)
      <input class="input" type="number" name="height" min="100" [ngModel]="height()" (ngModelChange)="height.set($event)" />
    </label>
  </div>
  <p class="text-muted text-sm">
    Détermine la taille de la zone où placer les tables (voir Plan) — un plan trop petit pour ses
    tables déborde, un plan trop grand laisse de l'espace vide autour.
  </p>

  <label class="checkbox-field">
    <input type="checkbox" name="active" [ngModel]="active()" (ngModelChange)="active.set($event)" />
    Actif
  </label>

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a class="btn btn-outline" routerLink="/parametres/salles">Annuler</a>
  </div>
</form>
