<a routerLink="/parametres" class="back-link">← Paramètres</a>

<div class="app-topbar">
  <h1 class="text-2xl">Rôles</h1>
</div>

<p class="text-muted text-sm" style="margin-bottom: var(--space-3)">
  Les rôles sont fixes — création et modification uniquement via le back-office technique.
</p>

<div class="card">
  <div class="card-body">
    <table class="table">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Slug</th>
          <th>Statut</th>
        </tr>
      </thead>
      <tbody>
        @for (role of roles(); track role.id) {
          <tr>
            <td>{{ role.name }}</td>
            <td class="text-muted">{{ role.slug }}</td>
            <td>
              @if (role.active) {
                <span class="badge badge-success">Actif</span>
              } @else {
                <span class="badge badge-neutral">Inactif</span>
              }
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="text-muted">Aucun rôle pour le moment.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
