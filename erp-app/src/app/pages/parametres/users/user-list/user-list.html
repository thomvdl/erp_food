<a routerLink="/parametres" class="back-link">← Paramètres</a>

<div class="app-topbar">
  <h1 class="text-2xl">Utilisateurs</h1>
  <a class="btn btn-primary" routerLink="nouveau">+ Ajouter</a>
</div>

<div class="card">
  <div class="card-body">
    <table class="table">
      <thead>
        <tr>
          <th>Nom d'utilisateur</th>
          <th>Email</th>
          <th>Rôles</th>
          <th>Statut</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (user of users(); track user.id) {
          <tr>
            <td>{{ user.username }}</td>
            <td class="text-muted">{{ user.email }}</td>
            <td>{{ roleNames(user) }}</td>
            <td>
              @if (user.active) {
                <span class="badge badge-success">Actif</span>
              } @else {
                <span class="badge badge-neutral">Inactif</span>
              }
            </td>
            <td>
              <div class="td-actions">
                <a class="btn btn-outline btn-sm" [routerLink]="[user.id]">Modifier</a>
              </div>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="text-muted">Aucun utilisateur pour le moment.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
