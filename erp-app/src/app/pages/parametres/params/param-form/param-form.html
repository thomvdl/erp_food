<a routerLink="/parametres/reglages" class="back-link">← Réglages</a>

<h1 class="text-2xl">{{ isEdit() ? 'Modifier le réglage' : 'Nouveau réglage' }}</h1>

<div class="card">
<div class="card-body">
<form class="form" (ngSubmit)="submit()">
  <label class="field">
    Nom
    <input
      class="input"
      type="text"
      name="name"
      placeholder="ex. open_at, close_at…"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
      required
    />
  </label>

  <label class="field">
    Valeur
    <input class="input" type="text" name="value" [ngModel]="value()" (ngModelChange)="value.set($event)" />
  </label>

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a class="btn btn-outline" routerLink="/parametres/reglages">Annuler</a>
  </div>
</form>
</div>
</div>
