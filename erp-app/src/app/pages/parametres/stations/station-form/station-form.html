<a routerLink="/parametres/stations" class="back-link">← Stations</a>

<h1 class="text-2xl">{{ isEdit() ? 'Modifier la station' : 'Nouvelle station' }}</h1>

<div class="card">
<div class="card-body">
<form class="form" (ngSubmit)="submit()">
  <label class="field">
    Nom
    <input class="input" type="text" name="name" [ngModel]="name()" (ngModelChange)="name.set($event)" required />
  </label>

  <label class="field">
    Passe
    <select class="select" name="passe" [ngModel]="passeId()" (ngModelChange)="passeId.set($event)">
      <option [ngValue]="null">— Aucun —</option>
      @for (passe of selectablePasses(); track passe.id) {
        <option [ngValue]="passe.id">{{ passe.name }}</option>
      }
    </select>
  </label>

  <label class="checkbox-field">
    <input type="checkbox" name="active" [ngModel]="active()" (ngModelChange)="active.set($event)" />
    Actif
  </label>

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a class="btn btn-outline" routerLink="/parametres/stations">Annuler</a>
  </div>
</form>
</div>
</div>
