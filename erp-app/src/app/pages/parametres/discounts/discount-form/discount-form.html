<a routerLink="/parametres/reductions" class="back-link">← Réductions</a>

<h1 class="text-2xl">{{ isEdit() ? 'Modifier la réduction' : 'Nouvelle réduction' }}</h1>

<div class="card">
<div class="card-body">
<form class="form" (ngSubmit)="submit()">
  <label class="field">
    Code
    <input
      class="input"
      type="text"
      name="code"
      placeholder="ex. BIENVENUE10"
      style="text-transform: uppercase"
      [ngModel]="code()"
      (ngModelChange)="code.set($event)"
      required
    />
  </label>

  <label class="field">
    Type
    <select class="select" name="type" [ngModel]="type()" (ngModelChange)="type.set($event)">
      <option value="percentage">Pourcentage</option>
      <option value="fixed_amount">Montant fixe</option>
      <option value="free_product">Produit gratuit</option>
    </select>
  </label>

  @if (type() === 'percentage') {
    <label class="field">
      Pourcentage (%)
      <input
        class="input"
        type="number"
        step="0.01"
        min="0"
        max="100"
        name="value"
        [ngModel]="value()"
        (ngModelChange)="value.set($event === null || $event === '' ? null : +$event)"
        required
      />
    </label>
  } @else if (type() === 'fixed_amount') {
    <label class="field">
      Montant (€)
      <input
        class="input"
        type="number"
        step="0.01"
        min="0"
        name="value"
        [ngModel]="value()"
        (ngModelChange)="value.set($event === null || $event === '' ? null : +$event)"
        required
      />
    </label>
  } @else {
    <label class="field">
      Produit offert
      <select class="select" name="free_product" [ngModel]="freeProductId()" (ngModelChange)="freeProductId.set($event)" required>
        <option [ngValue]="null">— Choisir un produit —</option>
        @for (product of products(); track product.id) {
          <option [ngValue]="product.id">{{ product.name }}</option>
        }
      </select>
    </label>
  }

  <label class="field">
    Montant d'achat minimum requis (€) — optionnel
    <input
      class="input"
      type="number"
      step="0.01"
      min="0"
      name="minimum_total"
      placeholder="Aucun minimum"
      [ngModel]="minimumTotal()"
      (ngModelChange)="minimumTotal.set($event === null || $event === '' ? null : +$event)"
    />
    <span class="text-muted text-xs">
      Le code n'est utilisable qu'à partir de ce montant de panier — une fois atteint, la réduction s'applique en entier (ex. "10 € offerts dès 15 € d'achat" donne bien 10 €, jamais moins).
    </span>
  </label>

  <div class="field" style="display: flex; gap: var(--space-4)">
    <label class="field" style="flex: 1">
      Début de validité
      <app-date-picker [ngModel]="startsAt()" name="starts_at" (ngModelChange)="startsAt.set($event)" placeholder="Date de début" />
    </label>
    <label class="field" style="flex: 1">
      Fin de validité
      <app-date-picker [ngModel]="endsAt()" name="ends_at" (ngModelChange)="endsAt.set($event)" placeholder="Date de fin" />
    </label>
  </div>

  <label class="checkbox-field">
    <input type="checkbox" name="active" [ngModel]="active()" (ngModelChange)="active.set($event)" />
    Actif
  </label>

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <div class="form-actions">
    <button type="submit" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Enregistrement...' : 'Enregistrer' }}
    </button>
    <a class="btn btn-outline" routerLink="/parametres/reductions">Annuler</a>
  </div>
</form>
</div>
</div>
