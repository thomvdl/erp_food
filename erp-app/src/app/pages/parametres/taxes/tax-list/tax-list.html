<a routerLink="/parametres" class="back-link">← Paramètres</a>

<div class="app-topbar">
  <h1 class="text-2xl">Taxes</h1>
  <a class="btn btn-primary" routerLink="nouveau">+ Ajouter</a>
</div>

<div class="card">
  <div class="card-body">
    <table class="table">
      <thead>
        <tr>
          <th>Slug</th>
          <th>Valeur</th>
          <th>Statut</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (tax of taxes(); track tax.id) {
          <tr>
            <td>{{ tax.slug }}</td>
            <td>{{ tax.value }}&nbsp;%</td>
            <td>
              @if (tax.active) {
                <span class="badge badge-success">Actif</span>
              } @else {
                <span class="badge badge-neutral">Inactif</span>
              }
            </td>
            <td>
              <div class="td-actions">
                <a class="btn btn-outline btn-sm" [routerLink]="[tax.id]">Modifier</a>
              </div>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="text-muted">Aucune taxe pour le moment.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
