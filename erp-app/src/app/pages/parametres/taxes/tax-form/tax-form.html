<a routerLink="/parametres/taxes" class="back-link">← Taxes</a>

<h1 class="text-2xl">{{ isEdit() ? 'Modifier la taxe' : 'Nouvelle taxe' }}</h1>

<form class="form" (ngSubmit)="submit()">
  <label class="field">
    Slug
    <input class="input" type="text" name="slug" [ngModel]="slug()" (ngModelChange)="slug.set($event)" required />
  </label>

  <label class="field">
    Valeur (%)
    <input
      class="input"
      type="number"
      step="0.01"
      min="0"
      name="value"
      [ngModel]="value()"
      (ngModelChange)="value.set($event)"
      required
    />
  </label>

  <label class="checkbox-field">
    <input type="checkbox" name="active" [ngModel]="active()" (ngModelChange)="active.set($event)" />
    Actif
  </label>

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a class="btn btn-outline" routerLink="/parametres/taxes">Annuler</a>
  </div>
</form>
