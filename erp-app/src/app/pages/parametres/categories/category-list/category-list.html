<a routerLink="/parametres" class="back-link">← Paramètres</a>

<div class="app-topbar">
  <h1 class="text-2xl">Catégories</h1>
  <a class="btn btn-primary" routerLink="nouveau">+ Ajouter</a>
</div>

<div class="card">
  <div class="card-body">
    <table class="table">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Slug</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (category of categories(); track category.id) {
          <tr>
            <td>{{ category.name }}</td>
            <td class="text-muted">{{ category.slug }}</td>
            <td style="display:flex; gap: 0.5rem; justify-content: flex-end;">
              <a class="btn btn-outline btn-sm" [routerLink]="[category.id]">Modifier</a>
              <button type="button" class="btn btn-danger btn-sm" (click)="remove(category)">Supprimer</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="text-muted">Aucune catégorie pour le moment.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
